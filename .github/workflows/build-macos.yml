name: Build macos release
run-name: nunchuk-macos-${{ github.ref_type == 'tag' && 'v' || '' }}${{ github.ref_name }}${{ github.event_name == 'workflow_dispatch' && '-manual' || '' }}

on:
  push:
    tags: [ "*" ]
  workflow_dispatch: {}

jobs:
  resolve-version:
    name: Resolve build version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      artifact_suffix: ${{ steps.resolve.outputs.artifact_suffix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve build version
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            # Match the version packaged into the macOS app.
            version="$(sed -n -E 's/^[[:space:]]*project\(Nunchuk VERSION ([0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*)\).*/\1/p' CMakeLists.txt | head -n1)"
            if [[ -z "${version}" ]]; then
              echo "Could not find project(Nunchuk VERSION X.Y.Z) in CMakeLists.txt" >&2
              exit 1
            fi
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
            echo "Invalid resolved build version: ${version}" >&2
            exit 1
          fi
          echo "Resolved build version: ${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          artifact_ref="$(printf '%s' "${GITHUB_REF_NAME}" | LC_ALL=C tr -c 'A-Za-z0-9._-' '-')"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then artifact_ref="v${artifact_ref}"; fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then artifact_ref+="-manual"; fi
          echo "artifact_suffix=${artifact_ref}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build macOS ${{ matrix.arch }}
    needs: resolve-version
    env:
      BUILD_VERSION: ${{ needs.resolve-version.outputs.version }}
      ARTIFACT_SUFFIX: ${{ needs.resolve-version.outputs.artifact_suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    # Keep tool logs outside the checkout so the clean-tree check succeeds.
    defaults:
      run:
        working-directory: nunchuk-desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: nunchuk-desktop

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_16.4.app
          xcodebuild -version
          clang --version

      # Keep the Qt version and module list aligned with macos.lock.env.
      - name: Install pinned Qt 6.9.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          host: 'mac'
          dir: ${{ runner.temp }}/qt
          modules: 'qtmultimedia qtnetworkauth qtwebengine qtwebchannel qtpositioning qt5compat qtshadertools'

      - name: Configure Qt path
        run: |
          set -euo pipefail
          qt_root="${QT_ROOT_DIR:?install-qt-action did not export QT_ROOT_DIR}"
          if [[ ! -x "${qt_root}/bin/macdeployqt" ]]; then
            echo "install-qt-action did not install Qt where this workflow expected it: ${qt_root}" >&2
            exit 1
          fi
          echo "QT_ROOT=${qt_root}" >> "${GITHUB_ENV}"

      - name: Build (unsigned)
        env:
          ARCH: ${{ matrix.arch }}
          TAG: ${{ env.BUILD_VERSION }}
          OUTPUT_DIR: ${{ runner.temp }}/macos-output/${{ matrix.arch }}
        run: bash reproducible-builds/build_macos.sh

      # Transfer the tar to preserve Unix file modes and symlinks.
      - name: Upload unsigned payload archive
        uses: actions/upload-artifact@v4
        with:
          name: nunchuk-macos-${{ matrix.arch }}-${{ env.ARTIFACT_SUFFIX }}-unsigned
          path: |
            ${{ runner.temp }}/macos-output/${{ matrix.arch }}/nunchuk-macos-${{ matrix.arch }}-v${{ env.BUILD_VERSION }}-unsigned.tar
            ${{ runner.temp }}/macos-output/${{ matrix.arch }}/nunchuk-macos-${{ matrix.arch }}-v${{ env.BUILD_VERSION }}-unsigned.tar.sha256
          if-no-files-found: error
          compression-level: 0

  sign:
    name: Sign & notarize ${{ matrix.arch }}
    needs: [resolve-version, build]
    env:
      BUILD_VERSION: ${{ needs.resolve-version.outputs.version }}
      ARTIFACT_SUFFIX: ${{ needs.resolve-version.outputs.artifact_suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    environment: release-signing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download unsigned payload
        uses: actions/download-artifact@v4
        with:
          name: nunchuk-macos-${{ matrix.arch }}-${{ env.ARTIFACT_SUFFIX }}-unsigned
          path: unsigned

      - name: Verify and extract payload
        shell: bash
        run: |
          set -euo pipefail
          name_prefix="nunchuk-macos-${{ matrix.arch }}-v${BUILD_VERSION}-unsigned"
          archive="unsigned/${name_prefix}.tar"
          # Check archive integrity after transfer.
          ( cd unsigned && shasum -a 256 --check "${name_prefix}.tar.sha256" )

          mkdir -p payload
          tar -xf "${archive}" -C payload
          if [[ ! -d "payload/Nunchuk.app" ]]; then
            echo "Extracted payload does not contain Nunchuk.app" >&2
            exit 1
          fi

          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "${GITHUB_ENV}"
          echo "UNSIGNED_PAYLOAD_SHA256=$(awk '{ print $1 }' "unsigned/${name_prefix}.tar.sha256")" >> "${GITHUB_ENV}"

      - name: Sign, notarize and package DMG
        env:
          PROJECT_DIR: ${{ github.workspace }}
          ARCH: ${{ matrix.arch }}
          TAG: ${{ env.BUILD_VERSION }}
          PAYLOAD_DIR: ${{ github.workspace }}/payload
          OUTPUT_DIR: ${{ runner.temp }}/signed-output
          MACOS_CERTIFICATE: ${{ secrets.PROD_MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.PROD_MACOS_CERTIFICATE_PWD }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_NAME }}
          MACOS_CI_KEYCHAIN_PWD: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}
          PROD_MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.IO_APPLE_ID }}
          PROD_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.IO_APPLE_TEAM_ID }}
          PROD_MACOS_NOTARIZATION_PWD: ${{ secrets.IO_APPLE_APP_PASSWORD }}
        run: bash reproducible-builds/sign_macos.sh

      - name: Upload signed release assets
        uses: actions/upload-artifact@v4
        with:
          name: nunchuk-macos-${{ matrix.arch }}-${{ env.ARTIFACT_SUFFIX }}
          path: |
            ${{ runner.temp }}/signed-output/nunchuk-macos-${{ matrix.arch }}-v${{ env.BUILD_VERSION }}.dmg
            ${{ runner.temp }}/signed-output/nunchuk-macos-${{ matrix.arch }}-v${{ env.BUILD_VERSION }}.dmg.sha256
            ${{ runner.temp }}/signed-output/nunchuk-macos-${{ matrix.arch }}-v${{ env.BUILD_VERSION }}.release.json
          if-no-files-found: error
          compression-level: 0

  publish-release:
    name: Publish macOS release assets (signed)
    needs: [resolve-version, sign]
    env:
      BUILD_VERSION: ${{ needs.resolve-version.outputs.version }}
    if: github.event_name != 'workflow_dispatch' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    # Serialize publication across platform workflows.
    concurrency:
      group: release-publish-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download signed assets (x86_64 + arm64)
        uses: actions/download-artifact@v4
        with:
          pattern: nunchuk-macos-*-v${{ env.BUILD_VERSION }}
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*.dmg release-assets/*.sha256 release-assets/*.json)
          bash .github/scripts/publish-release.sh "${assets[@]}"
