name: Build linux release
run-name: ${{ github.event_name == 'workflow_dispatch' && format('{0}_manual', inputs.version) || github.ref_name }}

on:
  push:
    tags:     [ "*" ]
  workflow_dispatch:
    inputs:
      version:
        description: Package version used for a manual build
        required: false
        default: 0.0.0

jobs:
  build-image-and-app:
    runs-on: ubuntu-24.04
    env:
      BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || '0.0.0' }}

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate build version
        shell: bash
        run: |
          if [[ ! "${BUILD_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
            echo "Invalid build version: ${BUILD_VERSION}"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push builder image
        working-directory: ${{ github.workspace }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f reproducible-builds/Dockerfile.linux \
            -t ghcr.io/${{ github.repository }}/nunchuk-builder-linux-amd64 \
            --cache-from type=registry,ref=ghcr.io/${{ github.repository }}/builder-cache \
            --cache-to   type=registry,ref=ghcr.io/${{ github.repository }}/builder-cache,mode=max \
            --push .

      - name: Build application
        run: |
          docker run --platform linux/amd64 --rm \
            -e TAG="${BUILD_VERSION}" \
            -v ${{ github.workspace }}:/project \
            -w /project \
            ghcr.io/${{ github.repository }}/nunchuk-builder-linux-amd64 \
            bash reproducible-builds/build_linux.sh

      - name: Verify packaged Linux runtime
        shell: bash
        run: |
          set -euo pipefail

          release_root="nunchuk-linux-v${BUILD_VERSION}"
          app_dir="${release_root}/Appdir"
          appimage="${release_root}/nunchuk-linux-v${BUILD_VERSION}.AppImage"
          archive="${release_root}/nunchuk-linux-v${BUILD_VERSION}.zip"

          if [[ ! -x "${appimage}" ]]; then
            echo "Packaged AppImage was not found or is not executable: ${appimage}"
            exit 1
          fi
          if [[ ! -f "${archive}" ]]; then
            echo "Release archive was not found: ${archive}"
            exit 1
          fi

          echo "Verifying AppDir dependency closure"
          bash reproducible-builds/appdir_tool.sh verify \
            "${app_dir}" \
            /dev/stdout

          verify_root="$(mktemp -d)"
          trap 'rm -rf -- "${verify_root}"' EXIT
          (
            cd "${verify_root}"
            "${GITHUB_WORKSPACE}/${appimage}" --appimage-extract >/dev/null
          )
          extracted_appdir="${verify_root}/squashfs-root"
          echo "Verifying extracted AppImage dependency closure"
          bash reproducible-builds/appdir_tool.sh verify \
            "${extracted_appdir}" \
            /dev/stdout

          unzip -tq "${archive}"
          archive_entries="$(unzip -Z1 "${archive}")"
          if [[ "${archive_entries}" != "$(basename -- "${appimage}")" ]]; then
            echo "Release ZIP must contain only the AppImage at its root."
            echo "${archive_entries}"
            exit 1
          fi

      - name: Run Linux SSL and smoke tests
        shell: bash
        run: |
          set -euo pipefail

          docker run --platform linux/amd64 --rm -i \
            -e BUILD_VERSION="${BUILD_VERSION}" \
            -v "${GITHUB_WORKSPACE}:/project" \
            -w /project \
            ghcr.io/${{ github.repository }}/nunchuk-builder-linux-amd64 \
            bash -s <<'CI_TESTS'
          set -euo pipefail

          release_root="/project/nunchuk-linux-v${BUILD_VERSION}"
          app_dir="${release_root}/Appdir"
          appimage="${release_root}/nunchuk-linux-v${BUILD_VERSION}.AppImage"
          test_root="$(mktemp -d)"
          trap 'rm -rf -- "$test_root"' EXIT

          [[ -d "$app_dir" ]] || {
              echo "Packaged AppDir was not found: $app_dir" >&2
              exit 1
          }
          [[ -x "$appimage" ]] || {
              echo "Packaged AppImage was not found: $appimage" >&2
              exit 1
          }

          extract_root="$test_root/appimage"
          mkdir -p "$extract_root"
          (
              cd "$extract_root"
              "$appimage" --appimage-extract >/dev/null
          )
          extracted_appdir="$extract_root/squashfs-root"
          [[ -d "$extracted_appdir" ]] || {
              echo "The generated AppImage could not be extracted" >&2
              exit 1
          }

          probe_root="$test_root/ssl-probe"
          ssl_probe="$probe_root/nunchuk-ssl-probe"
          mkdir -p "$probe_root"
          cat > "$probe_root/ssl-probe.cpp" <<'SSL_PROBE_SOURCE'
          #include <QCoreApplication>
          #include <QSslCertificate>
          #include <QSslSocket>
          #include <QTextStream>
          #include <cstdio>

          int main(int argc, char **argv)
          {
              QCoreApplication app(argc, argv);
              const bool supportsSsl = QSslSocket::supportsSsl();
              const QString buildVersion = QSslSocket::sslLibraryBuildVersionString();
              const QString runtimeVersion = QSslSocket::sslLibraryVersionString();
              const QString caFile = qEnvironmentVariable("SSL_CERT_FILE");
              const auto certificates = QSslCertificate::fromPath(caFile);

              QTextStream output(stdout);
              output << "supports_ssl=" << (supportsSsl ? "true" : "false") << '\n'
                     << "ssl_build_version=" << buildVersion << '\n'
                     << "ssl_runtime_version=" << runtimeVersion << '\n'
                     << "ca_certificates=" << certificates.size() << '\n';
              output.flush();

              return supportsSsl &&
                     runtimeVersion.startsWith(QStringLiteral("OpenSSL 1.1.1")) &&
                     !certificates.isEmpty() ? 0 : 1;
          }
          SSL_PROBE_SOURCE
          cat > "$probe_root/ssl-probe.pro" <<'SSL_PROBE_PROJECT'
          QT += core network
          CONFIG += console c++11
          CONFIG -= app_bundle
          TEMPLATE = app
          TARGET = nunchuk-ssl-probe
          SOURCES += ssl-probe.cpp
          SSL_PROBE_PROJECT
          (
              cd "$probe_root"
              "$QT_INSTALLED_PREFIX/bin/qmake" ssl-probe.pro
              make -j2
          )
          [[ -x "$ssl_probe" ]] || {
              echo "Qt TLS runtime probe could not be built" >&2
              exit 1
          }

          run_ssl_probe()
          {
              local runtime_root="$1"
              env \
                  LD_LIBRARY_PATH="$runtime_root/lib:$runtime_root/bin" \
                  SSL_CERT_FILE="$runtime_root/resources/ca-certificates.crt" \
                  "$ssl_probe"
          }

          echo "Testing SSL in packaged AppDir"
          run_ssl_probe "$app_dir"
          echo "Testing SSL in extracted AppImage"
          run_ssl_probe "$extracted_appdir"

          smoke_log="$test_root/appimage-smoke.log"
          set +e
          timeout --signal=TERM --kill-after=10s 30s \
              dbus-run-session -- \
              xvfb-run -a -s '-screen 0 1280x800x24' \
              "$extracted_appdir/AppRun" \
              > "$smoke_log" 2>&1
          smoke_status=$?
          set -e

          if [[ "$smoke_status" -ne 124 ]]; then
              cat "$smoke_log"
              echo "AppImage smoke test failed with status $smoke_status" >&2
              exit 1
          fi
          if grep -Eiq \
              'error while loading shared libraries|symbol lookup error|could not load the qt platform plugin|no qt platform plugin could be initialized|qqmlapplicationengine failed to load component|module .* is not installed|type .* unavailable|could not find qtwebengineprocess|qt webengine resources not found|qsslsocket: cannot (resolve|call)|tls initialization failed|no functional tls backend' \
              "$smoke_log"; then
              cat "$smoke_log"
              echo "AppImage smoke log contains a runtime error" >&2
              exit 1
          fi
          echo "Linux SSL and smoke tests passed."
          CI_TESTS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nunchuk-linux-v${{ env.BUILD_VERSION }}
          path: nunchuk-linux-v${{ env.BUILD_VERSION }}/nunchuk-linux-v${{ env.BUILD_VERSION }}.zip
          if-no-files-found: error
          compression-level: 0

      - name: Create or update GitHub prerelease
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_archive="nunchuk-linux-v${BUILD_VERSION}/nunchuk-linux-v${BUILD_VERSION}.zip"

          if gh release view "${BUILD_VERSION}" >/dev/null 2>&1; then
            gh release edit "${BUILD_VERSION}" \
              --title "${BUILD_VERSION}" \
              --notes-file reproducible-builds/release-notes.md \
              --draft=false \
              --prerelease
            gh release upload "${BUILD_VERSION}" "${release_archive}" --clobber
          else
            gh release create "${BUILD_VERSION}" "${release_archive}" \
              --verify-tag \
              --title "${BUILD_VERSION}" \
              --notes-file reproducible-builds/release-notes.md \
              --prerelease \
              --latest=false
          fi
