name: Build linux release
run-name: ${{ github.event_name == 'workflow_dispatch' && format('{0}_manual', inputs.version) || github.ref_name }}

on:
  push:
    tags:     [ "*" ]
  workflow_dispatch:
    inputs:
      version:
        description: Package version used for a manual build
        required: false
        default: 0.0.0

jobs:
  build-image-and-app:
    runs-on: ubuntu-24.04
    env:
      BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || '0.0.0' }}

    permissions:
      contents: write
      packages: write

    steps:
      - name: Configure Git for private GitLab submodules
        env:
          GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
        run: |
          git config --global url."https://oauth2:${GITLAB_PAT}@gitlab.com/".insteadOf "https://gitlab.com/"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate build version
        shell: bash
        run: |
          if [[ ! "${BUILD_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
            echo "Invalid build version: ${BUILD_VERSION}"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push builder image
        working-directory: ${{ github.workspace }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f reproducible-builds/Dockerfile.linux \
            -t ghcr.io/${{ github.repository }}/nunchuk-builder-linux-amd64 \
            --cache-from type=registry,ref=ghcr.io/${{ github.repository }}/builder-cache \
            --cache-to   type=registry,ref=ghcr.io/${{ github.repository }}/builder-cache,mode=max \
            --push .

      - name: Build application
        run: |
          docker run --platform linux/amd64 --rm \
            -e TAG="${BUILD_VERSION}" \
            -v ${{ github.workspace }}:/project \
            -w /project \
            ghcr.io/${{ github.repository }}/nunchuk-builder-linux-amd64 \
            bash reproducible-builds/build_linux.sh

      - name: Verify packaged Linux runtime
        shell: bash
        run: |
          set -euo pipefail

          release_root="nunchuk-linux-v${BUILD_VERSION}"
          app_dir="${release_root}/Appdir"
          appimage="${release_root}/nunchuk-linux-v${BUILD_VERSION}.AppImage"
          archive="${release_root}/nunchuk-linux-v${BUILD_VERSION}.zip"

          if [[ ! -x "${appimage}" ]]; then
            echo "Packaged AppImage was not found or is not executable: ${appimage}"
            exit 1
          fi
          if [[ ! -f "${archive}" ]]; then
            echo "Release archive was not found: ${archive}"
            exit 1
          fi

          echo "Verifying AppDir dependency closure"
          bash reproducible-builds/appdir_tool.sh verify \
            "${app_dir}" \
            /dev/stdout

          verify_root="$(mktemp -d)"
          trap 'rm -rf -- "${verify_root}"' EXIT
          (
            cd "${verify_root}"
            "${GITHUB_WORKSPACE}/${appimage}" --appimage-extract >/dev/null
          )
          extracted_appdir="${verify_root}/squashfs-root"
          echo "Verifying extracted AppImage dependency closure"
          bash reproducible-builds/appdir_tool.sh verify \
            "${extracted_appdir}" \
            /dev/stdout

          unzip -tq "${archive}"
          archive_entries="$(unzip -Z1 "${archive}")"
          if [[ "${archive_entries}" != "$(basename -- "${appimage}")" ]]; then
            echo "Release ZIP must contain only the AppImage at its root."
            echo "${archive_entries}"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nunchuk-linux-v${{ env.BUILD_VERSION }}
          path: nunchuk-linux-v${{ env.BUILD_VERSION }}/nunchuk-linux-v${{ env.BUILD_VERSION }}.zip
          if-no-files-found: error
          compression-level: 0

      - name: Create or update GitHub prerelease
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_archive="nunchuk-linux-v${BUILD_VERSION}/nunchuk-linux-v${BUILD_VERSION}.zip"

          if gh release view "${BUILD_VERSION}" >/dev/null 2>&1; then
            gh release edit "${BUILD_VERSION}" \
              --title "${BUILD_VERSION}" \
              --notes-file reproducible-builds/release-notes.md \
              --draft=false \
              --prerelease
            gh release upload "${BUILD_VERSION}" "${release_archive}" --clobber
          else
            gh release create "${BUILD_VERSION}" "${release_archive}" \
              --verify-tag \
              --title "${BUILD_VERSION}" \
              --notes-file reproducible-builds/release-notes.md \
              --prerelease \
              --latest=false
          fi
