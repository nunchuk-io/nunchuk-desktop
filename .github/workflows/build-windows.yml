name: Build windows release
run-name: nunchuk-windows-${{ github.ref_type == 'tag' && 'v' || '' }}${{ github.ref_name }}${{ github.event_name == 'workflow_dispatch' && '-manual' || '' }}

# Windows release artifacts are unsigned.

on:
  push:
    tags: [ "*" ]
  workflow_dispatch:
    inputs:
      check_reproducible_build:
        description: Check reproducible build
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Prepare artifact names
        run: |
          $artifactRef = $env:GITHUB_REF_NAME -replace '[^A-Za-z0-9._-]', '-'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $artifactRef = "v$artifactRef" }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $artifactRef += '-manual' }
          "ARTIFACT_NAME=nunchuk-windows-x64-$artifactRef" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Allow long submodule paths; avoid CRLF conversion and robocopy symlink errors.
      - name: Configure git for a byte-faithful checkout
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          git config --global core.symlinks false

      # Best-effort workaround for Defender locking files during robocopy.
      - name: Exclude build paths from Windows Defender scanning
        run: |
          try {
            Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE -ErrorAction Stop
            Add-MpPreference -ExclusionPath "C:\nunchuk-repro" -ErrorAction Stop
            Add-MpPreference -ExclusionPath "C:\nunchuk-repro-check" -ErrorAction Stop
            Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
            Write-Host "Windows Defender exclusions/real-time monitoring configured."
          }
          catch {
            Write-Warning "Could not configure Windows Defender exclusions (continuing anyway): $_"
          }

      - name: Check out repository
        # Action SHAs and toolchain versions match windows-dependencies.lock.json.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive

      - name: Resolve source commit, epoch and version
        run: |
          $commit = (git rev-parse HEAD).Trim()
          $epoch = (git show -s --format=%ct HEAD).Trim()
          if ($commit -notmatch '^[0-9a-f]{40}$' -or [string]::IsNullOrWhiteSpace($epoch)) {
            Write-Error "Could not resolve a valid commit/epoch for the checked-out ref."
            exit 1
          }
          "EXPECTED_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SOURCE_DATE_EPOCH_VALUE=$epoch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building commit $commit (epoch $epoch)"

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME
            $source = "release tag"
          }
          else {
            $cmakeText = Get-Content -LiteralPath "CMakeLists.txt" -Raw
            $found = @([regex]::Matches(
              $cmakeText,
              '(?im)^\s*project\s*\([^\)\r\n]*\bVERSION\s+([0-9]+\.[0-9]+\.[0-9]+)\b'
            ) | ForEach-Object { $_.Groups[1].Value } | Select-Object -Unique)
            if ($found.Count -ne 1) {
              Write-Error "Expected exactly one project(VERSION ...) in CMakeLists.txt; found $($found.Count): $($found -join ', ')"
              exit 1
            }
            $version = $found[0]
            $source = "CMakeLists.txt (auto-detected for this manual build)"
          }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Error "Invalid build version resolved from ${source}: '$version' (build_windows.ps1/package_windows.ps1 require exactly X.Y.Z, no pre-release suffix)"
            exit 1
          }
          "BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Resolved build version '$version' from $source"

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c
        with:
          arch: x64
          toolset: 14.44.35207
          sdk: 10.0.22621.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          architecture: x64

      # NASM is required by OpenSSL, but is not yet pinned in the lock file.
      - name: Install NASM
        run: |
          choco install nasm -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nasmDir = "$env:ProgramFiles\NASM"
          $nasmExe = Join-Path $nasmDir "nasm.exe"
          if (!(Test-Path -LiteralPath $nasmExe -PathType Leaf)) {
            Write-Error "nasm.exe not found under $nasmDir after Chocolatey install."
            exit 1
          }
          $nasmDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $nasmExe -v

      - name: Build application
        # Keep full logs outside the build tree for the failure artifact.
        run: |
          $buildLogPath = Join-Path $env:RUNNER_TEMP "nunchuk-windows-build.log"
          try {
            & .\reproducible-builds\build_windows.ps1 `
              -Replica a `
              -ExpectedCommit $env:EXPECTED_COMMIT `
              -ReleaseVersion $env:BUILD_VERSION `
              -SourceDateEpoch ([long]$env:SOURCE_DATE_EPOCH_VALUE) *>&1 |
              Tee-Object -FilePath $buildLogPath
          }
          catch {
            # Terminating errors are outside the tee pipeline.
            $errorText = "`n==== build_windows.ps1 terminating error ====`n" + `
              "Exception: $($_.Exception.Message)`n" + `
              "ScriptStackTrace:`n$($_.ScriptStackTrace)`n" + `
              "LASTEXITCODE at catch time: $LASTEXITCODE`n"
            Add-Content -LiteralPath $buildLogPath -Value $errorText
            Write-Host $errorText
            Write-Host "::error::build_windows.ps1 failed; see the uploaded *-build-log artifact for the full untruncated output."
            throw
          }

      - name: Package application (unsigned)
        run: |
          $packageLogPath = Join-Path $env:RUNNER_TEMP "nunchuk-windows-package.log"
          try {
            & .\reproducible-builds\package_windows.ps1 `
              -ExpectedCommit $env:EXPECTED_COMMIT `
              -ReleaseVersion $env:BUILD_VERSION `
              -SourceDateEpoch ([long]$env:SOURCE_DATE_EPOCH_VALUE) `
              -ArtifactFlavor unsigned `
              -ApplicationExe C:\nunchuk-repro\build-output\nunchuk-qt.exe `
              -BuildInfoFile C:\nunchuk-repro\build-output\build-info.json `
              -TlsProbeExe C:\nunchuk-repro\build-output\qt-tls-probe.exe `
              -SmokeTest *>&1 |
              Tee-Object -FilePath $packageLogPath
          }
          catch {
            $errorText = "`n==== package_windows.ps1 terminating error ====`n" + `
              "Exception: $($_.Exception.Message)`n" + `
              "ScriptStackTrace:`n$($_.ScriptStackTrace)`n" + `
              "LASTEXITCODE at catch time: $LASTEXITCODE`n"
            Add-Content -LiteralPath $packageLogPath -Value $errorText
            Write-Host $errorText
            Write-Host "::error::package_windows.ps1 failed; see the uploaded *-build-log artifact for the full untruncated output."
            throw
          }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.ARTIFACT_NAME }}-build-log
          path: |
            ${{ runner.temp }}\nunchuk-windows-build.log
            ${{ runner.temp }}\nunchuk-windows-package.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build artifacts
        # Upload the first build before the optional comparison.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: C:\nunchuk-repro\artifacts
          if-no-files-found: error

      # Optional second build: compare the payload manifest, ZIP and installer.
      - name: Save first build for reproducibility check
        if: github.event_name == 'workflow_dispatch' && inputs.check_reproducible_build
        run: |
          $checkDir = "C:\nunchuk-repro-check\build1"
          New-Item -ItemType Directory -Path $checkDir -Force | Out-Null
          # The rebuild resets C:\nunchuk-repro, so save outputs outside it.
          Copy-Item -Path "C:\nunchuk-repro\artifacts\*" -Destination $checkDir -Recurse -Force
          Get-ChildItem $checkDir | Select-Object Name, Length

      - name: Rebuild application for reproducibility check
        if: github.event_name == 'workflow_dispatch' && inputs.check_reproducible_build
        run: |
          & .\reproducible-builds\build_windows.ps1 `
            -Replica b `
            -ExpectedCommit $env:EXPECTED_COMMIT `
            -ReleaseVersion $env:BUILD_VERSION `
            -SourceDateEpoch ([long]$env:SOURCE_DATE_EPOCH_VALUE)
          & .\reproducible-builds\package_windows.ps1 `
            -ExpectedCommit $env:EXPECTED_COMMIT `
            -ReleaseVersion $env:BUILD_VERSION `
            -SourceDateEpoch ([long]$env:SOURCE_DATE_EPOCH_VALUE) `
            -ArtifactFlavor unsigned `
            -ApplicationExe C:\nunchuk-repro\build-output\nunchuk-qt.exe `
            -BuildInfoFile C:\nunchuk-repro\build-output\build-info.json `
            -TlsProbeExe C:\nunchuk-repro\build-output\qt-tls-probe.exe `
            -SmokeTest

      - name: Compare reproducibility check builds
        if: github.event_name == 'workflow_dispatch' && inputs.check_reproducible_build
        run: |
          function Get-ZipEntryHash($Entry) {
            $stream = $Entry.Open()
            $sha256 = [System.Security.Cryptography.SHA256]::Create()
            try {
              return [System.BitConverter]::ToString($sha256.ComputeHash($stream))
            }
            finally {
              $stream.Dispose()
              $sha256.Dispose()
            }
          }

          $namePrefix = "nunchuk-windows-x64-v$env:BUILD_VERSION-unsigned"
          $build1 = "C:\nunchuk-repro-check\build1"
          $build2 = "C:\nunchuk-repro\artifacts"

          $files = @("payload-manifest.sha256", "$namePrefix.zip", "$namePrefix-setup.exe")
          $summary = New-Object System.Collections.Generic.List[string]
          $summary.Add("### Windows reproducible build check")
          $summary.Add("")
          $summary.Add("| File | First SHA256 | Second SHA256 | Byte-identical |")
          $summary.Add("| --- | --- | --- | --- |")
          $diagnosticLines = New-Object System.Collections.Generic.List[string]
          $allMatch = $true
          foreach ($file in $files) {
            $path1 = Join-Path $build1 $file
            $path2 = Join-Path $build2 $file
            if (!(Test-Path -LiteralPath $path1) -or !(Test-Path -LiteralPath $path2)) {
              Write-Error "Missing expected file for comparison: $file"
              exit 1
            }
            $hash1 = (Get-FileHash -LiteralPath $path1 -Algorithm SHA256).Hash
            $hash2 = (Get-FileHash -LiteralPath $path2 -Algorithm SHA256).Hash
            $match = $hash1 -eq $hash2
            $summary.Add("| $file | $hash1 | $hash2 | $match |")
            if ($match) { continue }
            $allMatch = $false

            if ($file -like "*.sha256") {
              Write-Host "-- $file (text diff) --"
              $manifestDiff = Compare-Object -ReferenceObject (Get-Content -LiteralPath $path1) -DifferenceObject (Get-Content -LiteralPath $path2)
              $manifestDiff | ForEach-Object {
                $marker = if ($_.SideIndicator -eq '<=') { "build1 only" } else { "build2 only" }
                $line = "  [$marker] $($_.InputObject)"
                Write-Host $line
                $diagnosticLines.Add($line)
              }
              continue
            }

            if ($file -like "*.zip") {
              # Identify added, removed and changed files inside the ZIP.
              Add-Type -AssemblyName System.IO.Compression.FileSystem
              $zip1 = [System.IO.Compression.ZipFile]::OpenRead($path1)
              $zip2 = [System.IO.Compression.ZipFile]::OpenRead($path2)
              try {
                $entries1 = @{}
                foreach ($e in $zip1.Entries) { $entries1[$e.FullName] = $e }
                $entries2 = @{}
                foreach ($e in $zip2.Entries) { $entries2[$e.FullName] = $e }
                $allNames = @($entries1.Keys) + @($entries2.Keys) | Select-Object -Unique | Sort-Object
                foreach ($name in $allNames) {
                  $e1 = $entries1[$name]
                  $e2 = $entries2[$name]
                  if (!$e1 -or !$e2) {
                    $line = "  [zip entry only in $(if (!$e1) { 'build2' } else { 'build1' })] $name"
                    Write-Host $line
                    $diagnosticLines.Add($line)
                    continue
                  }
                  $entryHash1 = Get-ZipEntryHash $e1
                  $entryHash2 = Get-ZipEntryHash $e2
                  if ($entryHash1 -eq $entryHash2) { continue }
                  Write-Host "-- zip entry differs: $name --"
                  $diagnosticLines.Add("zip entry differs: $name")
                }
              }
              finally {
                $zip1.Dispose()
                $zip2.Dispose()
              }
            }
          }

          $summary.Add("")
          if ($diagnosticLines.Count -gt 0) {
            $summary.Add("<details><summary>Diff diagnostics</summary>")
            $summary.Add("")
            $summary.Add('```')
            $diagnosticLines | ForEach-Object { $summary.Add($_) }
            $summary.Add('```')
            $summary.Add("</details>")
            $summary.Add("")
          }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ($summary -join "`n")

          if ($allMatch) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "**Reproducible build check: PASSED**"
            Write-Host "Reproducible build check: PASSED"
            exit 0
          }

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "**Reproducible build check: NOT PASSED**"
          Write-Host "::error::Reproducible build check NOT PASSED: the two builds produced different bytes. See the job summary for hashes and changed files."
          exit 1

  publish-release:
    name: Publish Windows release assets (unsigned)
    needs: build
    if: github.event_name != 'workflow_dispatch' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    # Serialize publication across the Linux, macOS and Windows workflows.
    concurrency:
      group: release-publish-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nunchuk-windows-x64-v${{ github.ref_name }}
          path: release-assets

      - name: Create or update GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*.zip release-assets/*.exe release-assets/*.sha256 release-assets/*.json)
          bash .github/scripts/publish-release.sh "${assets[@]}"
